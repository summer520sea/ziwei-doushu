name: Ziwei MCP smoke test

on:
  push:
    paths:
      - "mcp-server/**"
      - "lib/ziwei/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ziwei-mcp-check.yml"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run mcp:smoke
      - run: npx tsc --noEmit
